name: Backend checks

on:
  pull_request:
    paths:
      - "unispot-server/**"
      - ".github/workflows/backend.yml"
  push:
    paths:
      - "unispot-server/**"
      - ".github/workflows/backend.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unispot-server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: unispot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d unispot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/unispot_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/unispot_test
      JWT_SECRET_KEY: ci-only-secret-that-is-at-least-32-characters
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --all-groups --locked
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy app tests
      - name: Verify migrations
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Test
        run: uv run pytest

  container-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unispot-server
    env:
      APP_ENV: test
      POSTGRES_USER: unispot
      POSTGRES_DB: unispot
      POSTGRES_PASSWORD: ci-only-database-password
      DATABASE_URL: postgresql+asyncpg://unispot:ci-only-database-password@postgres:5432/unispot
      JWT_SECRET_KEY: ci-only-secret-that-is-at-least-32-characters
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        run: docker compose config --quiet
      - name: Build and start API, migrations, database and worker
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify non-root runtime, readiness and worker
        run: |
          test "$(docker compose exec -T api id -u)" != "0"
          curl --fail --silent http://127.0.0.1:8000/health/readiness
          docker compose exec -T worker python -c "from app.worker import run; assert callable(run)"
          docker compose exec -T api alembic current
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Clean up disposable CI containers
        if: always()
        run: docker compose down --volumes
