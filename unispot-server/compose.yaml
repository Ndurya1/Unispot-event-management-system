name: unispot
x-api: &api
  build: .
  environment:
    APP_ENV: ${APP_ENV:-development}
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with the database host postgres}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
    MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-32768}
    REQUEST_BODY_TIMEOUT_SECONDS: ${REQUEST_BODY_TIMEOUT_SECONDS:-15}
    RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
    RATE_LIMIT_BOOKING: ${RATE_LIMIT_BOOKING:-30}
    RATE_LIMIT_AVAILABILITY: ${RATE_LIMIT_AVAILABILITY:-60}
    RATE_LIMIT_ASSISTANT: ${RATE_LIMIT_ASSISTANT:-20}
    ASSISTANT_TIMEOUT_SECONDS: ${ASSISTANT_TIMEOUT_SECONDS:-20}
    WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-30}
  init: true

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unispot}
      POSTGRES_USER: ${POSTGRES_USER:-unispot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    <<: *api
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/readiness', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    <<: *api
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import pathlib,sys; sys.exit(0 if any('app.worker' in p.read_text(errors='ignore') for p in pathlib.Path('/proc').glob('[0-9]*/cmdline')) else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
